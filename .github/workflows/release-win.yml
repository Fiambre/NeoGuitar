name: Release (Windows)

# Pushing a vX.Y.Z tag builds the Windows app, creates the installer and publishes a GitHub release.
# Windows keeps the classic vX.Y.Z tags on purpose: NeoGuitar 0.3.0 asks GitHub for the "latest" release and
# can only read tags like v0.4.0 (it would not understand win-v0.4.0 and would never offer the update).
# win-vX.Y.Z is accepted too. Other platforms use their own prefix (android-v*, tabs-v*) and are never "latest".
# It can also be run by hand (workflow_dispatch): it produces the files as artifacts without creating a release.
on:
  push:
    tags: ["v*", "win-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" -replace '^(win-)?v', '' }
          else { $v = (Select-String -Path neoguitar-win/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release -p neoguitar-win

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        working-directory: neoguitar-win
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\neoguitar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable version (zip)
        shell: pwsh
        working-directory: neoguitar-win
        run: |
          $dir = "dist\NeoGuitar-${{ steps.ver.outputs.version }}-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item ..\target\release\neoguitar.exe, ..\LICENSE, README.md $dir
          Copy-Item ..\soundfonts $dir -Recurse
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\NeoGuitar-${{ steps.ver.outputs.version }}-portable.zip"
          Remove-Item $dir -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: NeoGuitar-${{ steps.ver.outputs.version }}
          path: |
            neoguitar-win/dist/*-setup.exe
            neoguitar-win/dist/*-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Old installed copies (0.3.0) ask GitHub for the "latest" release, so Windows releases stay marked as latest.
          make_latest: "true"
          files: |
            neoguitar-win/dist/*-setup.exe
            neoguitar-win/dist/*-portable.zip