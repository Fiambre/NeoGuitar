name: Release

# Pushing a vX.Y.Z tag builds, creates the installer and publishes a GitHub release.
# It can also be run by hand (workflow_dispatch): it produces the files as artifacts without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: neoguitar-win
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neoguitar-win

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\neoguitar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable version (zip)
        shell: pwsh
        run: |
          $dir = "dist\NeoGuitar-${{ steps.ver.outputs.version }}-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\neoguitar.exe, LICENSE, README.md $dir
          Copy-Item soundfonts $dir -Recurse
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\NeoGuitar-${{ steps.ver.outputs.version }}-portable.zip"
          Remove-Item $dir -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: NeoGuitar-${{ steps.ver.outputs.version }}
          path: |
            neoguitar-win/dist/*-setup.exe
            neoguitar-win/dist/*-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            neoguitar-win/dist/*-setup.exe
            neoguitar-win/dist/*-portable.zip
