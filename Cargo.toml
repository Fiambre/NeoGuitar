[package]
name = "neoguitar"
version = "0.2.0"
edition = "2024"
description = "Lector, visor y reproductor de tablaturas Guitar Pro (GP3 a GP7) con interfaz egui"
license = "LGPL-2.1-or-later"
readme = "README.md"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
png = "0.18.1"
rfd = "0.18.0"
roxmltree = "0.21.2"
rustysynth = "1.3.8"
serde_json = "1"
ureq = "3"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"

# Local copy of rustysynth that accepts SoundFonts with empty instruments/presets (see vendor/rustysynth).
[patch.crates-io]
rustysynth = { path = "vendor/rustysynth" }
