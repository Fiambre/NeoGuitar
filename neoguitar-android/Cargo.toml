[package]
name = "neoguitar-android"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "NeoGuitar for Android: a practice-oriented player (sound, instrument mixing, tempo, metronome, lyrics)"

[lib]
name = "neoguitar_android"
crate-type = ["cdylib"]

# Everything is Android-only, so `cargo build --workspace` on a desktop still works (it builds an empty library).
[target.'cfg(target_os = "android")'.dependencies]
neoguitar-core = { path = "../crates/neoguitar-core" }
neoguitar-ui = { path = "../crates/neoguitar-ui" }
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.15"
log = "0.4"
