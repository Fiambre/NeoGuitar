[package]
name = "neoguitar-win"
version = "0.4.0"
edition.workspace = true
license.workspace = true
description = "NeoGuitar for Windows: Guitar Pro viewer and player with an egui interface"
readme = "README.md"

# The executable keeps its historical name (installer, file associations and the updater rely on it).
[[bin]]
name = "neoguitar"
path = "src/main.rs"

[lib]
name = "neoguitar_win"
path = "src/lib.rs"

[dependencies]
neoguitar-core = { path = "../crates/neoguitar-core" }
neoguitar-ui = { path = "../crates/neoguitar-ui" }
eframe = "0.37.0"
png = "0.18.1"
rfd = "0.18.0"
serde_json = "1"
sha2 = "0.10"
ureq = "3"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"
